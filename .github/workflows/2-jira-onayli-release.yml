name: Jira Onaylı Otomatik Release

on:
  repository_dispatch:
    types: [jira-release-approved]

permissions:
  contents: write

jobs:
  otomatik-release:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Yeni Sürüm Etiketi Oluştur ve Yayınla
        uses: actions/github-script@v7
        with:
          script: |
            const issueKey = context.payload.client_payload?.issue_key || "PROJ-1";
            const now = new Date();
            const tag = `v${now.getUTCFullYear()}.${String(now.getUTCMonth() + 1).padStart(2, '0')}.${String(now.getUTCDate()).padStart(2, '0')}-${String(now.getUTCHours()).padStart(2, '0')}${String(now.getUTCMinutes()).padStart(2, '0')}`;

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `${tag} (${issueKey} Onaylı Sürüm)`,
              body: `Jira **${issueKey}** kartı **Done** durumuna geçirildiği için otomatik olarak yayınlandı.`,
              draft: false,
              prerelease: false
            });
